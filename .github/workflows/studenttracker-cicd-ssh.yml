name: StudentTracker CI/CD SSH Deploy

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: studenttracker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-ci:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B test

  frontend-ci:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: npm run build

  deploy-staging:
    name: Deploy Staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs:
      - backend-ci
      - frontend-ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate staging deployment secrets
        env:
          STAGING_SERVER_IP: ${{ secrets.STAGING_SERVER_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=()
          for secret_name in STAGING_SERVER_IP SSH_PRIVATE_KEY; do
            if [ -z "${!secret_name}" ]; then
              missing+=("$secret_name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Deploy staging stack on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /root/StudentTracker
            git fetch origin
            git checkout develop || git checkout -b develop origin/develop
            git pull --ff-only origin develop
            docker compose --env-file .env -f docker-compose.staging.yml down
            docker compose --env-file .env -f docker-compose.staging.yml up -d --build --remove-orphans
            docker compose --env-file .env -f docker-compose.staging.yml ps
            set -a
            . ./.env
            set +a
            curl --fail --retry 10 --retry-delay 5 "http://127.0.0.1:${BACKEND_PORT}/api/health"

  deploy-production:
    name: Deploy Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend-ci
      - frontend-ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate production deployment secrets
        env:
          PROD_SERVER_IP: ${{ secrets.PROD_SERVER_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=()
          for secret_name in PROD_SERVER_IP SSH_PRIVATE_KEY; do
            if [ -z "${!secret_name}" ]; then
              missing+=("$secret_name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Deploy production stack on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /root/StudentTracker
            git fetch origin
            git checkout main || git checkout -b main origin/main
            git pull --ff-only origin main
            docker compose --env-file .env -f docker-compose.prod.yml down
            docker compose --env-file .env -f docker-compose.prod.yml up -d --build --remove-orphans
            docker compose --env-file .env -f docker-compose.prod.yml ps
            set -a
            . ./.env
            set +a
            curl --fail --retry 10 --retry-delay 5 "http://127.0.0.1:${BACKEND_PORT}/api/health"
